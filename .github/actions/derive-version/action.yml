name: 'Derive build version from pushed release tag'
description: 'Patch package, Tauri and Android versions from the validated immutable beta preparation output.'

inputs:
  tag:
    description: 'The vX.Y.Z pushed tag validated by the preparation job.'
    required: true

outputs:
  version:
    description: 'Numeric version from the pushed tag.'
    value: ${{ steps.parse.outputs.version }}
  version_code:
    description: 'Android versionCode (major*1_000_000 + minor*1_000 + patch).'
    value: ${{ steps.parse.outputs.version_code }}

runs:
  using: composite
  steps:
    - name: Parse pushed tag and patch version-bearing files
      id: parse
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: node scripts/derive-version.mjs
