name: 'Setup Rust Native Dependencies'
description: 'Install LLVM/libclang and cmake required by boring-sys2 (via rquest)'

runs:
  using: 'composite'
  steps:
    # llvm-dev + libclang-dev pull hundreds of MB of deps; cache the resolved
    # .debs so reinstalls across runs are near-instant. On a cache miss the
    # action installs normally, so first-run behaviour is unchanged.
    - name: Install LLVM + cmake (Ubuntu)
      if: runner.os == 'Linux'
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: llvm-dev libclang-dev clang cmake
        version: 1.0

    - name: Install LLVM + cmake (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # Install only when absent — macOS runners preinstall cmake, and a
        # plain `brew install` on an existing formula emits an annotation.
        for pkg in llvm cmake; do
          brew list "$pkg" &>/dev/null || brew install "$pkg"
        done
        echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

    - name: Install LLVM + cmake (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install llvm cmake --yes
        echo "LIBCLANG_PATH=C:\Program Files\LLVM\lib" >> $env:GITHUB_ENV
