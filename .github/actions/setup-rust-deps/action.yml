name: 'Setup Rust Native Dependencies'
description: 'Install LLVM/libclang and cmake required by boring-sys2 (via rquest)'

runs:
  using: 'composite'
  steps:
    # llvm-dev + libclang-dev pull hundreds of MB of deps; cache the resolved
    # .debs so reinstalls across runs are near-instant. On a cache miss the
    # action installs normally, so first-run behaviour is unchanged.
    - name: Install LLVM + cmake (Ubuntu)
      if: runner.os == 'Linux'
      uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1
      with:
        packages: llvm-dev libclang-dev clang cmake
        version: 1.0

    - name: Install LLVM + cmake (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # Install only when absent — macOS runners preinstall cmake, and a
        # plain `brew install` on an existing formula emits an annotation.
        for pkg in llvm cmake; do
          brew list "$pkg" &>/dev/null || brew install "$pkg"
        done
        echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

    - name: Install LLVM + cmake (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        choco install llvm cmake nasm --yes --no-progress

        $llvmRoot = 'C:\Program Files\LLVM'
        $llvmBin = Join-Path $llvmRoot 'bin'
        $clang = Join-Path $llvmBin 'clang.exe'
        $libclang = Join-Path $llvmBin 'libclang.dll'
        if (-not (Test-Path -LiteralPath $clang)) {
          throw "clang.exe was not installed at $clang"
        }
        if (-not (Test-Path -LiteralPath $libclang)) {
          throw "libclang.dll was not installed at $libclang"
        }

        $resourceDir = Get-ChildItem -LiteralPath (Join-Path $llvmRoot 'lib\clang') -Directory |
          Where-Object { $_.Name -match '^\d+(\.\d+)*$' } |
          Sort-Object { [version]$_.Name } -Descending |
          Select-Object -First 1
        if ($null -eq $resourceDir -or -not (Test-Path -LiteralPath (Join-Path $resourceDir.FullName 'include'))) {
          throw 'Unable to locate the Clang resource include directory.'
        }

        $resourceInclude = (Join-Path $resourceDir.FullName 'include').Replace('\', '/')
        "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "CLANG_PATH=$clang" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "BINDGEN_EXTRA_CLANG_ARGS=-isystem `"$resourceInclude`"" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

        & $clang --version
        cmake --version
        nasm -v
