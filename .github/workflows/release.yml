name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - release

# Release jobs create GitHub Releases and upload assets — the default
# GITHUB_TOKEN is read-only, so contents:write must be granted explicitly.
permissions:
  contents: write

env:
  NODE_VERSION: '22'
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install native deps for boring-sys2
        uses: ./.github/actions/setup-rust-deps

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          save-if: ${{ github.ref == 'refs/heads/release' }}

      - name: Run Rust tests
        run: cargo test -p bypass-core

  build-desktop:
    name: Desktop (${{ matrix.platform }})
    needs: test
    # Belt-and-suspenders: also declare write at the job level so the
    # GITHUB_TOKEN passed to tauri-action can create the draft release
    # even if a workflow-level permission inheritance bug applies.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: linux
          # Pinned to the explicit current image (= what `windows-latest`
          # resolves to today, VS 2022) to silence the
          # "windows-latest → windows-2025-vs2026 by June 15 2026"
          # runner notice and avoid surprise MSVC-major migration mid-CI.
          - platform: windows-2025
            target: windows
          - platform: macos-latest
            target: macos
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install native deps for boring-sys2
        uses: ./.github/actions/setup-rust-deps

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/release' }}

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: pnpm install --frozen-lockfile

      # Build with Tauri — no release flags. The matrix runs three jobs
      # (linux/windows/macos) in parallel; letting tauri-action create
      # the GitHub Release races at `POST /repos/.../releases` and the
      # late job (macOS, slower bundler) consistently loses with a
      # misleading "403 Resource not accessible by integration" instead
      # of the expected "422 tag already exists". We split build from
      # release upload to sidestep this entirely.
      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          # Updater signing — secrets injected by repo owner per
          # doc/release/GUIDE__updater-keys.md. tauri-action picks these up
          # automatically and emits one `.sig` per bundle the updater
          # endpoint type recognizes (.app.tar.gz, .AppImage, .nsis.zip,
          # .msi.zip in Tauri 2). Missing secrets → bundles ship unsigned
          # and the runtime updater rejects them at check() time.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          args: --verbose

      # Tag push → race-safe upload to GitHub Release via softprops.
      # Same action android/ios already use; tolerates the release
      # being created concurrently and silently skips empty globs on
      # platforms that don't produce that bundle type.
      - name: Upload desktop artifacts to release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: 'HiPaGo ${{ github.ref_name }}'
          body: 'See the assets below for platform-specific downloads.'
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.zip
            src-tauri/target/release/bundle/msi/*.msi.zip.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload desktop build as artifact (test)
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/**/*

  build-android:
    name: Android
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'

      - name: Setup Android SDK
        # v4 runs on node24 (v3 was the last Node 20 release — deprecated
        # June 2 2026, removed Sep 16 2026).
        uses: android-actions/setup-android@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install native deps for boring-sys2
        uses: ./.github/actions/setup-rust-deps

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          save-if: ${{ github.ref == 'refs/heads/release' }}

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build bypass-uniffi for Android
        run: node scripts/build-android.mjs

      - run: pnpm install --frozen-lockfile

      - name: Build static export
        run: node scripts/build-static.mjs

      - name: Sync Capacitor
        run: node node_modules/@capacitor/cli/bin/capacitor sync android

      # Decode the operator-injected release keystore (per
      # doc/release/GUIDE__android-keystore.md) into android/app/ so the
      # signingConfigs.release block in app/build.gradle can pick it up via
      # the HIPAGO_KEYSTORE_PATH Gradle property below.
      # Step is skipped when the secret is absent so branch builds and PRs
      # still produce an (unsigned) APK and the CI surface stays usable.
      - name: Materialize Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/hipago-release.jks
          test -s android/app/hipago-release.jks
          echo "Keystore materialized: $(wc -c < android/app/hipago-release.jks) bytes"

      - name: Build APK
        working-directory: android
        env:
          # Gradle reads ORG_GRADLE_PROJECT_X env vars as -PX. The app
          # module's signingConfigs.release uses findProperty('HIPAGO_*')
          # to consume these. All four must be present for signing to engage.
          ORG_GRADLE_PROJECT_HIPAGO_KEYSTORE_PATH: hipago-release.jks
          ORG_GRADLE_PROJECT_HIPAGO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_HIPAGO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_HIPAGO_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload APK to release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact (test)
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/*.apk

  build-ios:
    name: iOS
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install native deps for boring-sys2
        uses: ./.github/actions/setup-rust-deps

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          save-if: ${{ github.ref == 'refs/heads/release' }}

      - name: Build bypass-uniffi for iOS
        run: node scripts/build-ios.mjs

      - run: pnpm install --frozen-lockfile

      - name: Build static export
        run: node scripts/build-static.mjs

      - name: Install CocoaPods
        run: command -v pod || sudo gem install cocoapods

      - name: Sync Capacitor
        run: node node_modules/@capacitor/cli/bin/capacitor sync ios

      - name: Build iOS archive
        working-directory: ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Zip xcarchive for upload
        run: |
          cd ios/App/build
          zip -r -y App.xcarchive.zip App.xcarchive

      - name: Upload archive to release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: ios/App/build/App.xcarchive.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload archive as artifact (test)
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-archive
          path: ios/App/build/App.xcarchive.zip

  # Single-writer job that stitches the per-platform .sig files into the
  # Tauri updater manifest (`latest.json`) and uploads it to the same
  # draft release. Runs once, only on tag pushes, only after the desktop
  # matrix has finished uploading. Reads sigs back from the release via
  # `gh release download` so we never have to pass artifacts between jobs.
  publish-latest-json:
    name: Publish latest.json
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download .sig assets from the draft release
        run: |
          mkdir -p release-sigs
          # gh release download fetches assets from draft releases when the
          # token has contents:write. --pattern selects only signature files.
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern '*.sig' \
            --dir release-sigs
          ls -la release-sigs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version from tag
        id: ver
        run: |
          tag="${{ github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"          >> "$GITHUB_OUTPUT"

      - name: Build latest.json
        run: |
          node scripts/build-latest-json.mjs \
            --sig-dir release-sigs \
            --version "${{ steps.ver.outputs.version }}" \
            --tag "${{ steps.ver.outputs.tag }}" \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --notes "Release ${{ github.ref_name }} — see assets for downloads." \
            --out latest.json
          cat latest.json

      - name: Upload latest.json to the draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
