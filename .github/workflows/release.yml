name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - release

# Release jobs create GitHub Releases and upload assets — the default
# GITHUB_TOKEN is read-only, so contents:write must be granted explicitly.
permissions:
  contents: write

env:
  NODE_VERSION: '22'
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install native deps for boring-sys2
        uses: ./.github/actions/setup-rust-deps

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          save-if: ${{ github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Run Rust tests
        run: cargo test -p bypass-core

  build-desktop:
    name: Desktop (${{ matrix.platform }})
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: linux
          # Pin to the explicit Windows Server 2025 + VS 2026 image so the
          # runner migration is deliberate and the workflow avoids the
          # windows-2025 redirect notice.
          - platform: windows-2025-vs2026
            target: windows
          - platform: macos-latest
            target: macos
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      # Tag pushes: derive the build version from the tag and patch
      # tauri.conf.json + package.json + android/app/build.gradle in
      # the workspace so the bundlers bake the tagged version into
      # artifacts. Skipped on branch pushes (the if: guard).
      - name: Derive version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/derive-version

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install native deps for boring-sys2
        uses: ./.github/actions/setup-rust-deps

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: pnpm install --frozen-lockfile

      # Build with Tauri — no release flags. The matrix runs three jobs
      # (linux/windows/macos) in parallel; letting tauri-action create
      # the GitHub Release races at `POST /repos/.../releases` and the
      # late job (macOS, slower bundler) consistently loses with a
      # misleading "403 Resource not accessible by integration" instead
      # of the expected "422 tag already exists". We split build from
      # release upload to sidestep this entirely.
      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          # Updater signing — secrets injected by repo owner per
          # doc/release/GUIDE__updater-keys.md. tauri-action picks these up
          # automatically and emits one `.sig` per bundle the updater
          # endpoint type recognizes (.app.tar.gz, .AppImage, .nsis.zip,
          # .msi.zip in Tauri 2). Missing secrets → bundles ship unsigned
          # and the runtime updater rejects them at check() time.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          args: --verbose

      - name: Stage desktop release assets
        if: env.IS_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          out="release-assets"
          mkdir -p "$out"
          shopt -s nullglob

          copy_one() {
            local src="$1"
            local dest="$2"
            cp "$src" "$out/$dest"
            echo "$dest"
          }

          case "${{ matrix.target }}" in
            linux)
              for f in src-tauri/target/release/bundle/appimage/*.AppImage; do copy_one "$f" "HiPaGo_${version}_linux_x86_64.AppImage"; done
              for f in src-tauri/target/release/bundle/appimage/*.AppImage.sig; do copy_one "$f" "HiPaGo_${version}_linux_x86_64.AppImage.sig"; done
              for f in src-tauri/target/release/bundle/deb/*.deb; do copy_one "$f" "HiPaGo_${version}_linux_x86_64.deb"; done
              for f in src-tauri/target/release/bundle/rpm/*.rpm; do copy_one "$f" "HiPaGo_${version}_linux_x86_64.rpm"; done
              ;;
            macos)
              for f in src-tauri/target/release/bundle/dmg/*.dmg; do copy_one "$f" "HiPaGo_${version}_macos_aarch64.dmg"; done
              for f in src-tauri/target/release/bundle/macos/*.app.tar.gz; do copy_one "$f" "HiPaGo_${version}_macos_aarch64.app.tar.gz"; done
              for f in src-tauri/target/release/bundle/macos/*.app.tar.gz.sig; do copy_one "$f" "HiPaGo_${version}_macos_aarch64.app.tar.gz.sig"; done
              ;;
            windows)
              for f in src-tauri/target/release/bundle/nsis/*-setup.exe; do copy_one "$f" "HiPaGo_${version}_windows_x86_64-setup.exe"; done
              for f in src-tauri/target/release/bundle/nsis/*.nsis.zip; do copy_one "$f" "HiPaGo_${version}_windows_x86_64.nsis.zip"; done
              for f in src-tauri/target/release/bundle/nsis/*.nsis.zip.sig; do copy_one "$f" "HiPaGo_${version}_windows_x86_64.nsis.zip.sig"; done
              for f in src-tauri/target/release/bundle/msi/*.msi; do copy_one "$f" "HiPaGo_${version}_windows_x86_64.msi"; done
              for f in src-tauri/target/release/bundle/msi/*.msi.zip; do copy_one "$f" "HiPaGo_${version}_windows_x86_64.msi.zip"; done
              for f in src-tauri/target/release/bundle/msi/*.msi.zip.sig; do copy_one "$f" "HiPaGo_${version}_windows_x86_64.msi.zip.sig"; done
              ;;
          esac

          test "$(find "$out" -maxdepth 1 -type f | wc -l)" -gt 0
          find "$out" -maxdepth 1 -type f -print | sort

      - name: Upload desktop artifacts to release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          name: 'HiPaGo ${{ github.ref_name }}'
          body: 'See the assets below for platform-specific downloads.'
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload desktop build as artifact (test)
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/**/*

  build-android:
    name: Android
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Derive version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/derive-version

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'

      - name: Setup Android SDK
        # v4 runs on node24 (v3 was the last Node 20 release — deprecated
        # June 2 2026, removed Sep 16 2026).
        uses: android-actions/setup-android@v4
        with:
          # Avoid the default obsolete `tools` package, which pulls the
          # Android Emulator package even though release builds do not need it.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # Caches ~/.gradle (dependencies + wrapper) and the Gradle build cache,
      # with built-in cache cleanup to avoid unbounded growth. Big Android win:
      # without it Gradle re-downloads + recompiles every run.
      - name: Setup Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          # Default is read-only off the repo's default branch; releases run on
          # tags / the release branch, so write the cache there too — otherwise
          # it never persists across releases.
          cache-read-only: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install native deps for boring-sys2
        uses: ./.github/actions/setup-rust-deps

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          save-if: ${{ github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build bypass-uniffi for Android
        run: node scripts/build-android.mjs

      - run: pnpm install --frozen-lockfile

      - name: Build static export
        run: node scripts/build-static.mjs

      - name: Sync Capacitor
        run: node node_modules/@capacitor/cli/bin/capacitor sync android

      # Decode the operator-injected release keystore (per
      # doc/release/GUIDE__android-keystore.md) into android/app/ so the
      # signingConfigs.release block in app/build.gradle can pick it up via
      # the HIPAGO_KEYSTORE_PATH Gradle property below.
      # Step is skipped when the secret is absent so branch builds and PRs
      # still produce an (unsigned) APK and the CI surface stays usable.
      - name: Materialize Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/hipago-release.jks
          test -s android/app/hipago-release.jks
          echo "Keystore materialized: $(wc -c < android/app/hipago-release.jks) bytes"

      - name: Build APK
        working-directory: android
        env:
          # Gradle reads ORG_GRADLE_PROJECT_X env vars as -PX. The app
          # module's signingConfigs.release uses findProperty('HIPAGO_*')
          # to consume these. All four must be present for signing to engage.
          ORG_GRADLE_PROJECT_HIPAGO_KEYSTORE_PATH: hipago-release.jks
          ORG_GRADLE_PROJECT_HIPAGO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_HIPAGO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_HIPAGO_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: ./gradlew assembleRelease --build-cache

      - name: Verify APK is installable
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$build_tools/aapt" dump badging "$apk" | sed -n '1,8p'

      - name: Stage Android release asset
        if: env.IS_RELEASE == 'true'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/HiPaGo_${version}_android_universal.apk"
          ls -la release-assets

      - name: Upload APK to release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact (test)
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  build-ios:
    name: iOS
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Derive version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/actions/derive-version

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install native deps for boring-sys2
        uses: ./.github/actions/setup-rust-deps

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          save-if: ${{ github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build bypass-uniffi for iOS
        run: node scripts/build-ios.mjs

      - run: pnpm install --frozen-lockfile

      - name: Build static export
        run: node scripts/build-static.mjs

      # Reuse downloaded pods + the local CocoaPods spec cache across runs so
      # `cap sync ios` (which runs `pod install`) doesn't re-fetch every time.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
            ios/App/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install CocoaPods
        run: command -v pod || sudo gem install cocoapods

      # `cap sync ios` runs `pod install`, which clones pod sources (e.g.
      # SQLCipher) from GitHub. Those clones intermittently fail with a
      # transient "curl 56 Connection reset by peer" / early-EOF. Retry the
      # whole sync (idempotent) a few times before failing the build.
      - name: Sync Capacitor
        run: |
          for attempt in 1 2 3; do
            echo "::group::cap sync ios (attempt $attempt)"
            if node node_modules/@capacitor/cli/bin/capacitor sync ios; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "cap sync ios failed (attempt $attempt); retrying in 15s..."
            sleep 15
          done
          echo "cap sync ios failed after 3 attempts" >&2
          exit 1

      - name: Build iOS archive
        working-directory: ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Zip xcarchive for upload
        run: |
          cd ios/App/build
          zip -r -y App.xcarchive.zip App.xcarchive

      - name: Stage iOS release asset
        if: env.IS_RELEASE == 'true'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          cp ios/App/build/App.xcarchive.zip "release-assets/HiPaGo_${version}_ios_unsigned.xcarchive.zip"
          ls -la release-assets

      - name: Upload archive to release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload archive as artifact (test)
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-archive
          path: ios/App/build/App.xcarchive.zip

  # Single-writer job that stitches the per-platform .sig files into the
  # Tauri updater manifest (`latest.json`) and uploads it to the same
  # draft release. Runs once, only on tag pushes, only after the desktop
  # matrix has finished uploading. Reads sigs back from the release via
  # `gh release download` so we never have to pass artifacts between jobs.
  publish-latest-json:
    name: Publish latest.json
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download .sig assets from the draft release
        run: |
          mkdir -p release-sigs
          # gh release download fetches assets from draft releases when the
          # token has contents:write. --pattern selects only signature files.
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern '*.sig' \
            --dir release-sigs
          ls -la release-sigs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version from tag
        id: ver
        run: |
          tag="${{ github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"          >> "$GITHUB_OUTPUT"

      - name: Build latest.json
        run: |
          node scripts/build-latest-json.mjs \
            --sig-dir release-sigs \
            --version "${{ steps.ver.outputs.version }}" \
            --tag "${{ steps.ver.outputs.tag }}" \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --notes "Release ${{ github.ref_name }} — see assets for downloads." \
            --out latest.json
          cat latest.json

      - name: Upload latest.json to the draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish release
    needs:
      - build-android
      - build-ios
      - publish-latest-json
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish completed draft release
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
