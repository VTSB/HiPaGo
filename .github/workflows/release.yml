name: Beta release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: '22'
  # Run Node-based actions (actions/cache@v4 and the apt-cache action's
  # internal cache/restore+save) on Node 24. actions/cache@v4 is still a Node 20
  # action with no newer release yet; this is GitHub's documented bridge until
  # those actions ship Node 24 support, after which this line can be removed.
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: hipago-release-publication
  queue: max
  cancel-in-progress: false

jobs:
  # The pushed numeric tag selects the version. Validate its immutable object
  # and commit before reserving a draft; this workflow never creates tags.
  prepare:
    name: Validate tag and prepare beta
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      event_sha: ${{ steps.release.outputs.event_sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      release_id: ${{ steps.release.outputs.release_id }}
      originating_run_id: ${{ steps.release.outputs.originating_run_id }}
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # This job only runs Node scripts; pnpm is not installed.
          package-manager-cache: false
      - name: Validate pushed tag and draft (or verify an existing successful beta)
        id: release
        run: node scripts/release-automation.mjs prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.event_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install native deps for boring-sys2
        uses: ./.github/actions/setup-rust-deps

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          save-if: ${{ startsWith(github.ref, 'refs/tags/v') }}
          # Save the compiled target even when a later step fails (flaky pod
          # clone, APK signing, xcodebuild). Otherwise an expensive Rust build
          # is discarded and recompiled from scratch on the retry. The cache is
          # keyed on Cargo.lock + rustc, so stale entries self-evict.
          cache-on-failure: true

      - name: Run Rust tests
        run: cargo test -p bypass-core

  build-desktop:
    name: Desktop (${{ matrix.platform }})
    needs: [prepare, test]
    env:
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: linux
          # Pin to the explicit Windows Server 2025 + VS 2026 image so the
          # runner migration is deliberate and the workflow avoids the
          # windows-2025 redirect notice.
          - platform: windows-2025-vs2026
            target: windows
          - platform: macos-latest
            target: macos
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.event_sha }}
          persist-credentials: false

      - name: Derive version from pushed tag
        uses: ./.github/actions/derive-version
        with:
          tag: ${{ needs.prepare.outputs.tag }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install native deps for boring-sys2
        uses: ./.github/actions/setup-rust-deps

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target
          save-if: ${{ startsWith(github.ref, 'refs/tags/v') }}
          # Save the compiled target even when a later step fails (flaky pod
          # clone, APK signing, xcodebuild). Otherwise an expensive Rust build
          # is discarded and recompiled from scratch on the retry. The cache is
          # keyed on Cargo.lock + rustc, so stale entries self-evict.
          cache-on-failure: true

      # Resolve the full dependency tree on this runner; restoring cached
      # package files alone can leave native libraries or pkg-config files missing.
      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file libssl-dev \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
          pkg-config --atleast-version=2.70 glib-2.0
          pkg-config --modversion glib-2.0 gtk+-3.0 webkit2gtk-4.1

      - run: pnpm install --frozen-lockfile

      # Tauri's beforeBuildCommand runs `next build`; persist its webpack/SWC
      # compile cache so the frontend half of the desktop build warms across
      # runs. Keyed per-OS (matrix), restore-keys for incremental warm starts.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx', 'next.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      # Build with Tauri — no release flags. The matrix runs three jobs
      # (linux/windows/macos) in parallel; letting tauri-action create
      # the GitHub Release races at `POST /repos/.../releases` and the
      # late job (macOS, slower bundler) consistently loses with a
      # misleading "403 Resource not accessible by integration" instead
      # of the expected "422 tag already exists". We split build from
      # release upload to sidestep this entirely.
      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          # Updater signing — secrets injected by repo owner per
          # doc/release/GUIDE__updater-keys.md. tauri-action picks these up
          # automatically and emits one `.sig` per bundle the updater
          # endpoint type recognizes (.app.tar.gz, .AppImage, .nsis.zip,
          # .msi.zip in Tauri 2). Missing secrets → bundles ship unsigned
          # and the runtime updater rejects them at check() time.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          args: --verbose

      - name: Stage desktop release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          out="release-assets"
          mkdir -p "$out"
          shopt -s nullglob

          copy_one() {
            local src="$1"
            local dest="$2"
            cp "$src" "$out/$dest"
            echo "$dest"
          }

          case "${{ matrix.target }}" in
            linux)
              for f in src-tauri/target/release/bundle/appimage/*.AppImage; do copy_one "$f" "HiPaGo_${version}_linux_x86_64.AppImage"; done
              for f in src-tauri/target/release/bundle/appimage/*.AppImage.sig; do copy_one "$f" "HiPaGo_${version}_linux_x86_64.AppImage.sig"; done
              for f in src-tauri/target/release/bundle/deb/*.deb; do copy_one "$f" "HiPaGo_${version}_linux_x86_64.deb"; done
              for f in src-tauri/target/release/bundle/rpm/*.rpm; do copy_one "$f" "HiPaGo_${version}_linux_x86_64.rpm"; done
              ;;
            macos)
              for f in src-tauri/target/release/bundle/dmg/*.dmg; do copy_one "$f" "HiPaGo_${version}_macos_aarch64.dmg"; done
              for f in src-tauri/target/release/bundle/macos/*.app.tar.gz; do copy_one "$f" "HiPaGo_${version}_macos_aarch64.app.tar.gz"; done
              for f in src-tauri/target/release/bundle/macos/*.app.tar.gz.sig; do copy_one "$f" "HiPaGo_${version}_macos_aarch64.app.tar.gz.sig"; done
              ;;
            windows)
              for f in src-tauri/target/release/bundle/nsis/*-setup.exe; do copy_one "$f" "HiPaGo_${version}_windows_x86_64-setup.exe"; done
              for f in src-tauri/target/release/bundle/nsis/*-setup.exe.sig; do copy_one "$f" "HiPaGo_${version}_windows_x86_64-setup.exe.sig"; done
              for f in src-tauri/target/release/bundle/nsis/*.nsis.zip; do copy_one "$f" "HiPaGo_${version}_windows_x86_64.nsis.zip"; done
              for f in src-tauri/target/release/bundle/nsis/*.nsis.zip.sig; do copy_one "$f" "HiPaGo_${version}_windows_x86_64.nsis.zip.sig"; done
              for f in src-tauri/target/release/bundle/msi/*.msi; do copy_one "$f" "HiPaGo_${version}_windows_x86_64.msi"; done
              for f in src-tauri/target/release/bundle/msi/*.msi.sig; do copy_one "$f" "HiPaGo_${version}_windows_x86_64.msi.sig"; done
              for f in src-tauri/target/release/bundle/msi/*.msi.zip; do copy_one "$f" "HiPaGo_${version}_windows_x86_64.msi.zip"; done
              for f in src-tauri/target/release/bundle/msi/*.msi.zip.sig; do copy_one "$f" "HiPaGo_${version}_windows_x86_64.msi.zip.sig"; done
              ;;
          esac

          test "$(find "$out" -maxdepth 1 -type f | wc -l)" -gt 0
          find "$out" -maxdepth 1 -type f -print | sort

      - name: Upload desktop assets to the reserved draft
        run: node scripts/release-automation.mjs upload release-assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Android
    needs: [prepare, test]
    env:
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.event_sha }}
          persist-credentials: false

      - name: Derive version from pushed tag
        uses: ./.github/actions/derive-version
        with:
          tag: ${{ needs.prepare.outputs.tag }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'

      - name: Setup Android SDK
        # v4 runs on node24 (v3 was the last Node 20 release — deprecated
        # June 2 2026, removed Sep 16 2026).
        uses: android-actions/setup-android@v4
        with:
          # Avoid the default obsolete `tools` package, which pulls the
          # Android Emulator package even though release builds do not need it.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # Caches ~/.gradle (dependencies + wrapper) and the Gradle build cache,
      # with built-in cache cleanup to avoid unbounded growth. Big Android win:
      # without it Gradle re-downloads + recompiles every run.
      - name: Setup Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          # Default is read-only off the repo's default branch; releases run on
          # a release tag, so write the cache there too — otherwise
          # it never persists across releases.
          cache-read-only: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install native deps for boring-sys2
        uses: ./.github/actions/setup-rust-deps

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          save-if: ${{ startsWith(github.ref, 'refs/tags/v') }}
          # Save the compiled target even when a later step fails (flaky pod
          # clone, APK signing, xcodebuild). Otherwise an expensive Rust build
          # is discarded and recompiled from scratch on the retry. The cache is
          # keyed on Cargo.lock + rustc, so stale entries self-evict.
          cache-on-failure: true

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build bypass-uniffi for Android
        run: node scripts/build-android.mjs

      - run: pnpm install --frozen-lockfile

      # NOTE: no .next cache for the native static-export builds. A restored
      # .next/cache can leave the @capacitor-community/sqlite vendor chunk in a
      # previously tree-shaken state while only app chunks rebuild, which dropped
      # the SQLiteConnection class on a release build ("r is not a constructor").
      # Native release builds compile Next from clean for determinism.

      - name: Build static export
        run: node scripts/build-static.mjs

      - name: Sync Capacitor
        run: node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Run Android unit tests
        run: pnpm test:android:unit

      # Decode the operator-injected release keystore (per
      # doc/release/GUIDE__android-keystore.md) into android/app/ so the
      # signingConfigs.release block in app/build.gradle can pick it up via
      # the HIPAGO_KEYSTORE_PATH Gradle property below.
      # Step is skipped when the secret is absent; the following signed build
      # then fails before an unsigned artifact can be staged or uploaded.
      - name: Materialize Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/hipago-release.jks
          test -s android/app/hipago-release.jks
          echo "Keystore materialized: $(wc -c < android/app/hipago-release.jks) bytes"

      - name: Build APK
        working-directory: android
        env:
          # Gradle reads ORG_GRADLE_PROJECT_X env vars as -PX. The app
          # module's signingConfigs.release uses findProperty('HIPAGO_*')
          # to consume these. All four must be present for signing to engage.
          ORG_GRADLE_PROJECT_HIPAGO_KEYSTORE_PATH: hipago-release.jks
          ORG_GRADLE_PROJECT_HIPAGO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_HIPAGO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_HIPAGO_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
          HIPAGO_REQUIRE_SIGNED_RELEASE: 'true'
        run: ./gradlew assembleRelease --build-cache

      - name: Verify APK is installable
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$build_tools/aapt" dump badging "$apk" | sed -n '1,8p'

      - name: Stage Android release asset
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/HiPaGo_${version}_android_universal.apk"
          ls -la release-assets

      - name: Upload signed APK to the reserved draft
        run: node scripts/release-automation.mjs upload release-assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    name: iOS
    needs: [prepare, test]
    env:
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.event_sha }}
          persist-credentials: false

      - name: Derive version from pushed tag
        uses: ./.github/actions/derive-version
        with:
          tag: ${{ needs.prepare.outputs.tag }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install native deps for boring-sys2
        uses: ./.github/actions/setup-rust-deps

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          save-if: ${{ startsWith(github.ref, 'refs/tags/v') }}
          # Save the compiled target even when a later step fails (flaky pod
          # clone, APK signing, xcodebuild). Otherwise an expensive Rust build
          # is discarded and recompiled from scratch on the retry. The cache is
          # keyed on Cargo.lock + rustc, so stale entries self-evict.
          cache-on-failure: true

      - name: Build bypass-uniffi for iOS
        run: node scripts/build-ios.mjs

      - run: pnpm install --frozen-lockfile

      # NOTE: no .next cache for the native static-export builds. A restored
      # .next/cache can leave the @capacitor-community/sqlite vendor chunk in a
      # previously tree-shaken state while only app chunks rebuild, which dropped
      # the SQLiteConnection class on a release build ("r is not a constructor").
      # Native release builds compile Next from clean for determinism.

      - name: Build static export
        run: node scripts/build-static.mjs

      # Reuse downloaded pods + the local CocoaPods spec cache across runs so
      # `cap sync ios` (which runs `pod install`) doesn't re-fetch every time.
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
            ios/App/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install CocoaPods
        run: command -v pod || sudo gem install cocoapods

      # `cap sync ios` runs `pod install`, which clones pod sources (e.g.
      # SQLCipher) from GitHub. Those clones intermittently fail with a
      # transient "curl 56 Connection reset by peer" / early-EOF. Retry the
      # whole sync (idempotent) a few times before failing the build.
      - name: Sync Capacitor
        run: |
          for attempt in 1 2 3; do
            echo "::group::cap sync ios (attempt $attempt)"
            if node node_modules/@capacitor/cli/bin/capacitor sync ios; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "cap sync ios failed (attempt $attempt); retrying in 15s..."
            sleep 15
          done
          echo "cap sync ios failed after 3 attempts" >&2
          exit 1

      - name: Build iOS archive
        working-directory: ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Zip xcarchive for upload
        run: |
          cd ios/App/build
          zip -r -y App.xcarchive.zip App.xcarchive

      - name: Stage iOS release asset
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p release-assets
          cp ios/App/build/App.xcarchive.zip "release-assets/HiPaGo_${version}_ios_unsigned.xcarchive.zip"
          ls -la release-assets

      - name: Upload unsigned iOS archive to the reserved draft
        run: node scripts/release-automation.mjs upload release-assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Only the complete desktop matrix can produce the updater manifest.
  publish-latest-json:
    name: Prepare latest.json
    needs: [prepare, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.event_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Verify signatures and upload the complete updater manifest
        run: node scripts/release-automation.mjs manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish verified beta
    needs: [prepare, build-android, build-ios, publish-latest-json]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.event_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Validate artifacts, record provenance and publish prerelease
        run: node scripts/release-automation.mjs publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
