[package]
name = "bypass-core"
version = "0.1.0"
edition = "2021"
description = "ISP bypass library: DoH + TLS ClientHello fragmentation + Chrome TLS fingerprint"

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "time", "macros", "fs"] }
rquest = { version = "1", features = ["socks", "json"] }
base64 = "0.22"
rustls = "0.23.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio-rustls = "0.26.4"
url = "2"
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
