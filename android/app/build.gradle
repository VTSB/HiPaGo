apply plugin: 'com.android.application'
// Required to compile the UniFFI-generated Kotlin bindings dropped into
// src/main/java/uniffi/bypass/ by scripts/build-android.mjs.
apply plugin: 'kotlin-android'

android {
    namespace "com.hipago.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hipago.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "0.0.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Release signing is configured only when the four operator-injected
        // Gradle properties (set via ORG_GRADLE_PROJECT_* env in CI per
        // doc/release/GUIDE__android-keystore.md) are present. Without them
        // the block is created but no storeFile is set, so any build that
        // references it would fail loudly — this is intentional.
        release {
            def storeFilePath = findProperty('HIPAGO_KEYSTORE_PATH') as String
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword findProperty('HIPAGO_KEYSTORE_PASSWORD') as String
                keyAlias findProperty('HIPAGO_KEY_ALIAS') as String
                keyPassword findProperty('HIPAGO_KEY_ALIAS_PASSWORD') as String
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Apply release signing only when the operator's keystore props
            // are present. Local dev (no props) falls back to AGP's default
            // (unsigned release APK), so `./gradlew assembleRelease` does
            // not require a developer to provision the secret. CI sets the
            // props before `gradlew assembleRelease` runs.
            if (findProperty('HIPAGO_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
    // Match the JVM target capacitor.build.gradle sets for Java (17),
    // so the kotlin-android plugin and javac agree on bytecode level.
    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Kotlin stdlib + JNA — the generated UniFFI bindings link against both.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$rootProject.ext.kotlinVersion"
    implementation "net.java.dev.jna:jna:5.14.0@aar"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
