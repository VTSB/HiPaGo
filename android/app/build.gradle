apply plugin: 'com.android.application'
// Required to compile the UniFFI-generated Kotlin bindings dropped into
// generated/java/uniffi/bypass/ by scripts/build-android.mjs.
apply plugin: 'kotlin-android'

def releaseSigningPropNames = [
    'HIPAGO_KEYSTORE_PATH',
    'HIPAGO_KEYSTORE_PASSWORD',
    'HIPAGO_KEY_ALIAS',
    'HIPAGO_KEY_ALIAS_PASSWORD',
]

def readReleaseSigningProp = { name ->
    def value = findProperty(name)
    value == null ? '' : value.toString().trim()
}

def releaseSigningProps = releaseSigningPropNames.collectEntries { name ->
    [(name): readReleaseSigningProp(name)]
}
def releaseSigningRequested = releaseSigningProps.values().any { it }
def missingReleaseSigningProps = releaseSigningPropNames.findAll { !releaseSigningProps[it] }

if (releaseSigningRequested && !missingReleaseSigningProps.empty) {
    throw new GradleException(
        'Android release signing properties were partially provided; these are missing: ' +
            missingReleaseSigningProps.join(', ')
    )
}

if (releaseSigningRequested && !file(releaseSigningProps.HIPAGO_KEYSTORE_PATH).isFile()) {
    throw new GradleException(
        'Android release signing keystore was not found: ' +
            releaseSigningProps.HIPAGO_KEYSTORE_PATH
    )
}

android {
    namespace "com.hipago.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.hipago.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9009009
        versionName "9.9.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Release signing is configured only when the four operator-injected
        // Gradle properties (set via ORG_GRADLE_PROJECT_* env in CI per
        // doc/release/GUIDE__android-keystore.md) are present. Without them,
        // release builds intentionally fall back to signingConfigs.debug below
        // because local agents do not have access to the private distribution
        // key.
        release {
            if (releaseSigningRequested) {
                storeFile file(releaseSigningProps.HIPAGO_KEYSTORE_PATH)
                storePassword releaseSigningProps.HIPAGO_KEYSTORE_PASSWORD
                keyAlias releaseSigningProps.HIPAGO_KEY_ALIAS
                keyPassword releaseSigningProps.HIPAGO_KEY_ALIAS_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Apply distribution signing only when the operator's keystore
            // props are present. Local dev/agent builds deliberately use the
            // Android debug key so release APKs are installable without
            // exposing the private distribution key.
            if (releaseSigningRequested) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
    sourceSets {
        main {
            // bypass-uniffi outputs (libbypass_uniffi.so + generated Kotlin
            // bindings) are produced by scripts/build-android.mjs into
            // generated/ — kept out of src/ and gitignored. CI rebuilds them
            // before assembleRelease.
            jniLibs.srcDirs = ['generated/jniLibs']
            java.srcDir 'generated/java'
        }
    }
    // Match the JVM target capacitor.build.gradle sets for Java (17),
    // so the kotlin-android plugin and javac agree on bytecode level.
    kotlinOptions {
        jvmTarget = '17'
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Storage Access Framework helper — DocumentFile tree/file ops for the
    // user-picked download folder (PublicLibraryPlugin). Replaces the old
    // absolute-path File I/O that needed MANAGE_EXTERNAL_STORAGE.
    implementation "androidx.documentfile:documentfile:1.0.1"
    // WorkManager — runs the background gallery download worker
    // (GalleryDownloadWorker) so downloads survive app kill, on a connected
    // network constraint with a foreground-service progress notification.
    // 2.9.x is the stable line compatible with compileSdk 34.
    implementation "androidx.work:work-runtime:2.9.1"
    implementation project(':capacitor-android')
    // Kotlin stdlib + JNA — the generated UniFFI bindings link against both.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$rootProject.ext.kotlinVersion"
    implementation "net.java.dev.jna:jna:5.14.0@aar"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20240303"
    testImplementation "org.robolectric:robolectric:4.12.2"
    testImplementation "androidx.test:core:1.5.0"
    testImplementation "androidx.work:work-testing:2.9.1"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    if (findProject(':capacitor-cordova-android-plugins') != null) {
        implementation project(':capacitor-cordova-android-plugins')
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
